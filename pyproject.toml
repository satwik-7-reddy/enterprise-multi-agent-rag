[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "enterprise-multi-agent-rag"
version = "0.1.0"
description = "A production-oriented multi-agent retrieval-augmented generation platform."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "enterprise-multi-agent-rag contributors" },
]
dependencies = [
  "anthropic>=0.40,<1",
  "boto3>=1.35,<2",
  "faiss-cpu>=1.9,<2",
  "fastapi>=0.115,<1",
  "langchain>=0.3,<2",
  "langchain-anthropic>=0.3,<2",
  "langchain-aws>=0.2,<2",
  "langchain-community>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langchain-text-splitters>=0.3,<2",
  "langgraph>=0.2,<2",
  "mcp>=1,<2",
  "openai>=1.58,<3",
  "pypdf>=5.1,<7",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_multi_agent_rag"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
